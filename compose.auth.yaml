# Local development only. See docs/user-management.md for deployment settings.
services:
  players-db:
    image: postgres:17
    environment:
      POSTGRES_USER: napoleon
      POSTGRES_PASSWORD: napoleon-dev
      POSTGRES_DB: napoleon
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["players-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U napoleon"]
      interval: 5s
      timeout: 5s
      retries: 10
  keycloak-db:
    image: postgres:17
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak-dev
      POSTGRES_DB: keycloak
    volumes: ["keycloak-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak-dev
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./infra/keycloak/napoleon-realm.json:/opt/keycloak/data/import/napoleon-realm.json:ro"]
    depends_on:
      keycloak-db:
        condition: service_healthy
volumes:
  players-db:
  keycloak-db:
