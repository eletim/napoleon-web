[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "napoleon-ml"
version = "0.1.0"
description = "Strict Python loader for the Napoleon self-play dataset (manifest validation, streaming JSONL reading, NumPy tensorization)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
train = ["torch>=2.2"]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6", "torch>=2.2"]

[project.scripts]
napoleon-inspect-dataset = "napoleon_ml.cli.inspect_dataset:main"
napoleon-train-ownership-mlp = "napoleon_ml.cli.train_ownership_mlp:main"
napoleon-evaluate-ownership-mlp = "napoleon_ml.cli.evaluate_ownership_mlp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: cross-language tests that shell out to the TypeScript self-play CLI"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
